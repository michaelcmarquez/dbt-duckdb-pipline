models:
  - name: monthly_summary
    description: Monthly summary of job postings; one row per month.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Year and month of the summary.
        data_tests:
          - unique
          - not_null
      - name: total_postings
        description: All postings that month (summed from jobs_per_month).
      - name: remote_postings
        description: Postings flagged remote that month.
      - name: pct_remote
        description: Share of the month's postings flagged remote, percent.

  - name: job_postings
    description: Cleaned postings data from the raw source; one row per posting.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: Unique identifier for the posting.
      - name: job_title
        description: Title of the job posting.
        data_tests:
          - not_null
      - name: company_name
        description: Name of the company offering the job.
      - name: job_location
        description: Location of the job.
      - name: job_via
        description: Source through which the job was posted.
      - name: job_schedule_type
        description: Schedule type of the job (e.g., full-time, part-time).
      - name: job_work_from_home
        description: Whether the job is remote or not.
      - name: search_date
        description: Date when the job was searched.
      - name: search_term
        description: Search term used to find the job.
